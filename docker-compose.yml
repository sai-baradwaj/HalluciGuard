services:

  backend:
    build:
      context: "./Halluciguard backend"

    ports:
      - "8000:8000"

    env_file:
      - "./Halluciguard backend/.env"

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: halluciguard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"


volumes:
  postgres_data: